x-rental: &rental
  build:
    context: .
    dockerfile: Dockerfile.rental
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    STUBS_BASE_URL: http://stubs:3629
  depends_on:
    postgres:
      condition: service_healthy
    flyway:
      condition: service_completed_successfully
    stubs:
      condition: service_started
  networks:
    - app

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

  flyway:
    image: flyway/flyway:10
    command: ["-connectRetries=60", "migrate"]
    volumes:
      - ./db/migration:/flyway/migrations
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  stubs:
    build:
      context: .
      dockerfile: Dockerfile.stubs
    ports:
      - "3629:3629"
    networks:
      - app

  rental-1:
    <<: *rental
    ports:
      - "8000:8000"

  rental-2:
    <<: *rental
    ports:
      - "8001:8000"

  s3:
    # S3-совместимое хранилище для архива заказов, в проде на его месте настоящий S3
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.port=8333 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data
    networks:
      - app

  s3-init:
    image: amazon/aws-cli:2.22.35
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-archive}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-archive-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:8333 s3api head-bucket --bucket orders-archive 2>/dev/null
      || aws --endpoint-url http://s3:8333 s3api create-bucket --bucket orders-archive; do sleep 2; done"
    depends_on:
      s3:
        condition: service_started
    networks:
      - app

  archiver:
    <<: *rental
    command: ["python", "-m", "rental_service.archive_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ARCHIVE_S3_BUCKET: orders-archive
      ARCHIVE_S3_ENDPOINT: http://s3:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-archive}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-archive-secret}
      AWS_DEFAULT_REGION: us-east-1
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-30}
      ARCHIVE_INTERVAL_SECONDS: ${ARCHIVE_INTERVAL_SECONDS:-3600}
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  s3_data:

networks:
  app:
